name: MintaRestro Website Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy-Website:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout respositroy
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mintafresh/mintarestro-website:latest

      - name: Deploy to Vps via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "pulling latest docker image"
            sudo docker pull mintafresh/mintarestro-website:latest

            echo "Navigating to minta-restro/website" directory"
            cd /root/minta-restro/website

            echo "rebuilding and restarting services..."
            sudo docker compose up d

            echo "deployment completed successfully"

            "echo Cleaning up..."
            sudo docker system purne -f